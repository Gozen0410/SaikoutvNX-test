# Build trigger: rebuild the hardware-tested main baseline.
name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 5f08b286f3df737f3321d2247a6fe633fcead03c
          git checkout 5f08b286f3df737f3321d2247a6fe633fcead03c

      - name: Apply Switch font defaults
        working-directory: switch/borealis
        run: |
          set -eux
          app_source=library/lib/core/application.cpp
          grep -q 'static int regular = Application::getFont(FONT_CHINESE_SIMPLIFIED);' "$app_source"
          sed -i 's/static int regular = Application::getFont(FONT_CHINESE_SIMPLIFIED);/static int regular = Application::getFont(FONT_REGULAR);/' "$app_source"
          sed -i '/static int regular = Application::getFont(FONT_REGULAR);/a\
              if (regular == FONT_INVALID)\
                  regular = Application::getFont(FONT_CHINESE_SIMPLIFIED);' "$app_source"
          grep -q 'static int regular = Application::getFont(FONT_REGULAR);' "$app_source"
          grep -q 'if (regular == FONT_INVALID)' "$app_source"
          grep -q 'regular = Application::getFont(FONT_CHINESE_SIMPLIFIED);' "$app_source"

      - name: Verify Borealis compatibility
        working-directory: switch/borealis
        run: |
          set -eux
          test -f library/CMakeLists.txt
          test -f library/include/borealis/core/logger.hpp
          grep -q 'LOG_DEBUG' library/include/borealis/core/logger.hpp
          test -f library/include/borealis/views/tab_frame.hpp
          ! grep -q 'setTabContent' library/include/borealis/views/tab_frame.hpp

      - name: Install Borealis GLFW/OpenGL dependencies
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-curl switch-libwebp switch-libplacebo
          BASE_URL="https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/"
          mkdir -p /tmp/saikou-mpv
          curl -fL "${BASE_URL}switch-ffmpeg-7.1-1-any.pkg.tar.zst" -o /tmp/saikou-mpv/switch-ffmpeg.pkg.tar.zst
          curl -fL "${BASE_URL}switch-libmpv-0.36.0-3-any.pkg.tar.zst" -o /tmp/saikou-mpv/switch-libmpv.pkg.tar.zst
          dkp-pacman -U --noconfirm /tmp/saikou-mpv/switch-ffmpeg.pkg.tar.zst /tmp/saikou-mpv/switch-libmpv.pkg.tar.zst

      - name: Configure and build
        working-directory: switch
        run: |
          set -eux
          rm -rf cmake-build
          cmake -S . -B cmake-build \
            -DPLATFORM_SWITCH=ON \
            -DUSE_DEKO3D=OFF \
            -DUSE_GLFW=ON \
            -DUSE_SDL2=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build --target SaikouSwitch.nro -j2
          test -s cmake-build/SaikouSwitch.nro
          ls -lh cmake-build/SaikouSwitch.nro cmake-build/SaikouSwitch.elf cmake-build/SaikouSwitch.nacp

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaikouTV-NRO
          path: switch/cmake-build/SaikouSwitch.nro
          if-no-files-found: error
          retention-days: 14
